data:
  balance_data: true
  feature_dir: data/features
  features:
    use_mfb: true
    use_mfcc: true
    use_wav2vec2: true
  label_file: data/general_information.csv
  normalize_data: true
  split:
    random_state: 42
    test_size: 0.1
    val_size: 0.1
  target_frames: 300
  wav2vec2_layers:
  - 4
evaluation:
  threshold_optimization:
    enabled: true
    optimization_metric: f1
experiment:
  description: 基于VGG16和wav2vec2第4层的运动强度检测模型（V2版本：全类别训练、数据标准化、百分比混淆矩阵）
  name: VGG16_wav2vec2_layer4_exertion_detection_v2
model:
  dropout_rate: 0.6
  mfcc_dim: 40
  num_classes: 5
  wav2vec2_dim: 768
output:
  logging:
    level: INFO
  result_dir: result
system:
  gpu:
    enable_amp: true
    enable_benchmark: true
    enable_compile: false
    enable_flash_attention: false
    enable_tf32: true
    memory_fraction: 0.8
  seed: 42
training:
  batch_size: 128
  criterion: cross_entropy
  epochs: 15
  learning_rate: 1e-4
  n_folds: 1
  num_workers: 8
  optimizer: adamw
  patience: 10
  persistent_workers: false
  pin_memory: false
  prefetch_factor: 2
  scheduler: plateau
  weight_decay: 5e-4
wandb:
  description: 基于VGG16和wav2vec2第4层的运动强度检测模型训练
  enabled: true
  entity: null
  logging:
    confusion_matrix: true
    feature_importance: true
    gpu_usage: true
    gradients: true
    learning_rate: true
    model_params: true
    predictions: true
    system_info: true
    test_metrics: true
    train_metrics: true
    val_metrics: true
  model_save:
    checkpoint_interval: 10
    save_best: true
    save_checkpoints: true
  monitoring:
    cpu_usage: true
    gpu_interval: 30
    memory_usage: true
    network_usage: false
    system_interval: 60
  name: vgg16_wav2vec2_layer4_{timestamp}
  project: exertion-level-detection
  tags:
  - vgg16
  - wav2vec2
  - exertion-detection
  - audio-analysis
  visualization:
    confusion_matrix: true
    feature_importance: true
    learning_curves: true
    prediction_distribution: true
