data:
  balance_config:
    max_oversampling_ratio: 1.0
    target_samples_per_class: null
  balance_data: false
  feature_dir: data/features
  features:
    use_mfb: false
    use_mfcc: true
    use_wav2vec2: true
  label_file: data/general_information.csv
  leakage_check: true
  normalize_data: true
  split:
    random_state: 42
    test_size: 0.1
    use_stratified_split: true
    val_size: 0.1
  target_frames: 300
  wav2vec2_layers:
  - 4
evaluation:
  threshold_optimization:
    enabled: true
    optimization_metric: f1
experiment:
  description: 基于VGG16和wav2vec2第4层的运动强度检测模型（V8版本：极保守内存设置，避免OOM）
  name: VGG16_wav2vec2_layer4_exertion_detection_v8
model:
  dropout_rate: 0.6
  mfcc_dim: 40
  num_classes: 5
  wav2vec2_dim: 768
output:
  logging:
    level: INFO
  result_dir: result
system:
  gpu:
    enable_amp: false
    enable_benchmark: false
    enable_compile: false
    enable_flash_attention: false
    enable_tf32: false
    memory_fraction: 0.4
  seed: 42
training:
  batch_size: 16
  criterion: focal
  epochs: 30
  focal_alpha: 1.0
  focal_gamma: 2.0
  learning_rate: 1e-4
  n_folds: 1
  num_workers: 2
  optimizer: adamw
  patience: 5
  persistent_workers: false
  pin_memory: false
  prefetch_factor: 1
  scheduler: plateau
  weight_decay: 5e-4
wandb:
  description: 基于VGG16和wav2vec2第4层的运动强度检测模型训练
  enabled: true
  entity: null
  logging:
    confusion_matrix: true
    feature_importance: true
    gpu_usage: true
    gradients: true
    learning_rate: true
    model_params: true
    predictions: true
    system_info: true
    test_metrics: true
    train_metrics: true
    val_metrics: true
  model_save:
    checkpoint_interval: 10
    save_best: true
    save_checkpoints: true
  monitoring:
    cpu_usage: true
    gpu_interval: 30
    memory_usage: true
    network_usage: false
    system_interval: 60
  name: vgg16_wav2vec2_layer4_{timestamp}
  project: exertion-level-detection
  tags:
  - vgg16
  - wav2vec2
  - exertion-detection
  - audio-analysis
  visualization:
    confusion_matrix: true
    feature_importance: true
    learning_curves: true
    prediction_distribution: true
