data:
  feature_dir: data/features
  features:
    use_acoustic: true
    use_mfcc: true
    use_wav2vec2: true
  label_file: data/general_information.csv
  split:
    random_state: 42
    test_size: 0.1
    val_size: 0.1
  wav2vec2_layers:
  - 4
evaluation:
  threshold_optimization:
    enabled: true
    optimization_metric: f1
experiment:
  description: 基于VGG16和wav2vec2第4层的运动强度检测模型
  name: VGG16_wav2vec2_layer4_exertion_detection
output:
  logging:
    level: INFO
  result_dir: result
system:
  gpu:
    memory_fraction: 0.95
  seed: 42
training:
  batch_size: 8
  criterion: cross_entropy
  epochs: 3
  learning_rate: 1e-4
  n_folds: 5
  num_workers: 4
  optimizer: adamw
  patience: 20
  scheduler: cosine
  weight_decay: 1e-4
wandb:
  description: 基于VGG16和wav2vec2第4层的运动强度检测模型训练
  enabled: true
  entity: null
  logging:
    confusion_matrix: true
    feature_importance: true
    gpu_usage: true
    gradients: true
    learning_rate: true
    model_params: true
    predictions: true
    system_info: true
    test_metrics: true
    train_metrics: true
    val_metrics: true
  model_save:
    checkpoint_interval: 10
    save_best: true
    save_checkpoints: true
  monitoring:
    cpu_usage: true
    gpu_interval: 30
    memory_usage: true
    network_usage: false
    system_interval: 60
  name: vgg16_wav2vec2_layer4_{timestamp}
  project: exertion-level-detection
  tags:
  - vgg16
  - wav2vec2
  - exertion-detection
  - audio-analysis
  visualization:
    confusion_matrix: true
    feature_importance: true
    learning_curves: true
    prediction_distribution: true
