# 测试配置文件
# 用于单元测试的配置

data:
  feature_dir: "test_data/features"
  label_file: "test_data/labels.csv"
  features:
    use_acoustic: true
    use_mfb: true
    use_wav2vec2: true
    wav2vec2_layers: [4]

model:
  mfb_dim: 40
  mfcc_dim: 13
  wav2vec2_dim: 768
  num_classes: 5
  dropout_rate: 0.5
  use_mfcc: true
  use_wav2vec2: true
  optimize_for_rtx4070: false

training:
  batch_size: 4
  epochs: 5
  learning_rate: 1e-4
  weight_decay: 1e-4
  optimizer: "adamw"
  scheduler: "cosine"
  criterion: "cross_entropy"
  use_amp: false
  patience: 3

system:
  seed: 42
  num_workers: 0
  pin_memory: false

wandb:
  enabled: false
  project: "exertion-level-detection-test"
  name: "test_run"
  tags: ["test"]
  description: "单元测试运行"
  monitoring:
    gpu_interval: 5
    system_interval: 10
    gpu_usage: true
    memory_usage: true
    cpu_usage: true

# 测试特定配置
test:
  temp_dir: "test_temp"
  timeout: 300
  cleanup: true
  verbose: true
