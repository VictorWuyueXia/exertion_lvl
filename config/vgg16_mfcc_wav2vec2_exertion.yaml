# 运动强度检测模型训练配置文件
# 使用MFCC和wav2vec2特征，无数据泄露版本

# ==================== 数据配置 ====================
data:
  # 数据路径 - 使用新的无泄露分割
  train_audio_dir: "data/train_set/audio"
  test_audio_dir: "data/test_set/audio"
  train_labels_file: "data/train_set/labels/exertion_labels.csv"
  test_labels_file: "data/test_set/labels/exertion_labels.csv"
  
  # 特征选择 - 只使用MFCC和wav2vec2
  features:
    use_mfb: false      # 禁用MFB特征
    use_wav2vec2: true  # 使用wav2vec2特征
    use_mfcc: true      # 使用MFCC特征
  
  # 数据标准化
  normalize_data: true  # 启用数据标准化
  normalize_with_train_only: true  # 只使用训练集数据进行标准化
  
  # 数据泄露检查
  leakage_check: true   # 启用数据泄露检查
  
  # wav2vec2层选择
  wav2vec2_layers: [4, 8, 12]  # 使用第4、8、12层特征
  
  # 特征帧数配置
  target_frames: 300    # 目标帧数（20Hz采样率下的15秒音频）
  
  # 训练集内部分割
  train_val_split:
    val_size: 0.1       # 从训练集中分出10%作为验证集
    random_state: 42    # 随机种子
    use_stratified_split: true  # 使用分层分割

# ==================== 模型配置 ====================
model:
  # 特征维度配置
  mfcc_dim: 40          # MFCC特征维度
  wav2vec2_dim: 768     # wav2vec2特征维度
  num_classes: 5        # 分类数量（标签1,2,3,4,5）
  dropout_rate: 0.5     # Dropout率
  
  # 特征融合配置
  feature_fusion: "concatenate"  # 特征融合方式：concatenate, attention, weighted_sum

# ==================== 训练配置 ====================
training:
  # 基础参数
  epochs: 50            # 训练轮数
  batch_size: 32        # 批大小
  learning_rate: 1e-4   # 学习率
  weight_decay: 5e-4    # 权重衰减
  
  # 优化器选择
  optimizer: "adamw"    # AdamW优化器
  scheduler: "plateau"  # 基于验证损失的调度器
  
  # 损失函数
  criterion: "cross_entropy"  # 交叉熵损失
  
  # 早停
  patience: 10
  
  # 数据加载
  num_workers: 4        # 工作进程数
  pin_memory: true      # 启用内存固定
  persistent_workers: true  # 启用保持工作进程
  prefetch_factor: 2    # 预取因子

# ==================== 系统配置 ====================
system:
  # 随机种子
  seed: 42
  
  # GPU配置
  gpu:
    memory_fraction: 0.8   # GPU内存使用比例
    enable_benchmark: true # 启用cuDNN benchmark
    enable_flash_attention: true  # 启用Flash Attention
    enable_tf32: true      # 启用TF32
    enable_amp: true       # 启用自动混合精度
    enable_compile: false  # 禁用torch.compile

# ==================== 评估配置 ====================
evaluation:
  # 阈值优化
  threshold_optimization:
    enabled: true
    optimization_metric: "f1"  # f1, precision, recall
  
  # 测试集评估
  test_evaluation:
    enabled: true
    use_train_normalizer: true  # 使用训练集的标准化参数

# ==================== 输出配置 ====================
output:
  # 结果保存路径
  result_dir: "result"
  
  # 日志级别
  logging:
    level: "INFO"

# ==================== 实验配置 ====================
experiment:
  # 实验名称
  name: "VGG16_mfcc_wav2vec2_no_leakage"
  
  # 实验描述
  description: "基于VGG16的MFCC+wav2vec2特征融合运动强度检测模型（无数据泄露版本）"

# ==================== WandB配置 ====================
wandb:
  enabled: true
  project: "exertion-level-detection"
  name: "vgg16_mfcc_wav2vec2_no_leakage_{timestamp}"
  description: "VGG16模型使用MFCC和wav2vec2特征的无数据泄露运动强度检测"
  tags:
    - vgg16
    - mfcc
    - wav2vec2
    - no_leakage
    - exertion-detection
  logging:
    train_metrics: true
    val_metrics: true
    test_metrics: true
    confusion_matrix: true
    feature_importance: true
    gpu_usage: true
    system_info: true
  monitoring:
    gpu_usage: true
    cpu_usage: true
    memory_usage: true
    gpu_interval: 30
    system_interval: 60
