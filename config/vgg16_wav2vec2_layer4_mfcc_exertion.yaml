# Config for DualChannelExertionModel + CORAL
exp_name: vgg16_wav2vec2_mfcc_exertion_coral

# ==================== 数据配置 ====================
data:
  # 数据路径
  feature_dir: "data/processed/04_final/features"
  label_file: "data/processed/04_final/labels.csv"
  
  # 数据分割
  split:
    test_size: 0.1
    val_size: 0.2
    random_state: 42
    use_stratified_split: true
  
  # 特征选择
  features:
    use_mfb: false
    use_wav2vec2: true
    use_mfcc: true
    wav2vec2_layers: [6]
  
  # 数据平衡
  balance_data: false
  balance_config:
    target_samples_per_class: null
    max_oversampling_ratio: 1.0
  
  # 数据标准化
  normalize_data: true
  
  # 数据泄露检查
  leakage_check: true
  
  # 特征帧数配置
  target_frames: 750  # 15秒 * 50Hz = 750帧

# ==================== 模型配置 ====================
model:
  mfcc_dim: 40           # number of MFCC coefficients you computed
  wav2vec2_dim: 768      # dimension of your mid-layer wav2vec2 features
  hidden_dim: 256
  num_classes: 5
  in_ch: 1               # 3 if using MFCC+Δ+ΔΔ as channels
  dropout_rate: 0.2      # 增加dropout率以加强正则化
  optimize_for_gpu: true

# ==================== 训练配置 ====================
training:
  # 基础参数
  epochs: 40
  batch_size: 32
  learning_rate: 0.0001  # 降低学习率
  weight_decay: 0.01     # 回到原来的权重衰减
  
  # 优化器选择
  optimizer: "adamw"
  scheduler: "step"
  step_size: 5
  gamma: 0.5
  warmup_epochs: 0       # step调度器不需要预热
  max_epochs: 40
  min_lr_mult: 0.05
  
  # 损失函数 - 更温和的序数重加权
  criterion: "coral"
  coral_gamma: 1.0       # 降低focal loss强度
  coral_alpha: 1.0
  per_threshold_weight: [1.0, 1.02, 1.05, 1.08]  # 更温和的阈值权重
  
  # 早停
  patience: 10           # 增加耐心
  monitor: "qwk"
  
  # 单Fold训练
  n_folds: 1
  
  # 数据加载
  num_workers: 4
  pin_memory: true
  persistent_workers: false
  prefetch_factor: 1
  
  # 训练控制
  train_batches_per_epoch: null
  val_batches_per_epoch: null

# ==================== 系统配置 ====================
system:
  # 随机种子
  seed: 42
  
  # GPU配置
  gpu:
    memory_fraction: 0.9
    enable_benchmark: false
    enable_flash_attention: false
    enable_tf32: false
    enable_amp: false
    enable_compile: false

# ==================== 评估配置 ====================
evaluation:
  threshold_optimization:
    enabled: true
    optimization_metric: "f1"

# ==================== 输出配置 ====================
output:
  result_dir: "result"
  ckpt_dir: "./checkpoints"
  logging:
    level: "INFO"
    log_every: 20

# ==================== 实验配置 ====================
experiment:
  name: "VGG16_wav2vec2_layer4_exertion_detection_coral_v2"
  description: "基于VGG16和wav2vec2第4层的运动强度检测模型（V2版本：启用序数重加权和增强正则化）"
