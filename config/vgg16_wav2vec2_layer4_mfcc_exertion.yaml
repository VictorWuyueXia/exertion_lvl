# 运动强度检测模型训练配置文件（精简版）
# 只包含可能后期更改的参数

# ==================== 数据配置 ====================
data:
  # 数据路径
  feature_dir: "data/features"
  label_file: "data/general_information.csv"
  
  # 数据分割（可调整）
  split:
    test_size: 0.10      # 10%作为独立测试集
    val_size: 0.10       # 10%作为验证集（从训练集中分割）
    random_state: 42     # 随机种子
  
  # 特征选择（可调整）
  features:
    use_mfcc: true      # 使用MFCC特征
    use_wav2vec2: true  # 使用wav2vec2特征
    use_acoustic: true  # 使用MFCC特征（通过acoustic参数加载）
  
  # wav2vec2层选择（可调整）
  wav2vec2_layers: [4]  # 可尝试其他层：[7], [4,7], [4,7,12]

# ==================== 训练配置 ====================
training:
  # 基础参数（可调整）
  epochs: 3
  batch_size: 8        # 根据GPU内存调整
  learning_rate: 1e-4  # 可调整
  weight_decay: 1e-4   # 可调整
  
  # 优化器选择（可调整）
  optimizer: "adamw"   # adam, adamw, sgd
  scheduler: "cosine"  # cosine, step, plateau
  
  # 损失函数（可调整）
  criterion: "cross_entropy"  # cross_entropy, focal
  
  # 早停（可调整）
  patience: 20
  
  # 交叉验证（可调整）
  n_folds: 5
  
  # 数据加载（可调整）
  num_workers: 4

# ==================== 系统配置 ====================
system:
  # 随机种子（可调整）
  seed: 42
  
  # GPU配置（可调整）
  gpu:
    memory_fraction: 0.95  # GPU内存使用比例

# ==================== 评估配置 ====================
evaluation:
  # 阈值优化（可调整）
  threshold_optimization:
    enabled: true
    optimization_metric: "f1"  # f1, precision, recall

# ==================== 输出配置 ====================
output:
  # 结果保存路径（可调整）
  result_dir: "result"
  
  # 日志级别（可调整）
  logging:
    level: "INFO"

# ==================== 实验配置 ====================
experiment:
  # 实验名称（可调整）
  name: "VGG16_wav2vec2_layer4_exertion_detection"
  
  # 实验描述（可调整）
  description: "基于VGG16和wav2vec2第4层的运动强度检测模型"
