# 运动强度检测模型训练配置文件（RTX 4070深度优化版）
# 专门针对RTX 4070的12GB显存和并行计算能力优化

# ==================== 数据配置 ====================
data:
  # 数据路径
  feature_dir: "data/features"
  label_file: "data/general_information.csv"
  
  # 数据分割（单Fold训练，更大的验证集）
  split:
    test_size: 0.1      # 10%作为独立测试集
    val_size: 0.1       # 10%作为验证集
    random_state: 42     # 随机种子
  
  # 特征选择
  features:
    use_mfb: true      # 使用MFB特征
    use_wav2vec2: true  # 使用wav2vec2特征
    use_mfcc: true  # 使用MFCC特征
  
  # 数据平衡
  balance_data: true   # 启用数据平衡
  
  # 数据标准化
  normalize_data: true  # 启用数据标准化
  
  # wav2vec2层选择
  wav2vec2_layers: [4]  # 使用第4层特征
  
  # 特征帧数配置
  target_frames: 300    # 目标帧数（20Hz采样率下的15秒音频）

# ==================== 模型配置 ====================
model:
  # 特征维度配置（根据实际数据调整）
  mfcc_dim: 40          # 实际MFCC维度
  wav2vec2_dim: 768     # wav2vec2特征维度
  num_classes: 5        # 分类数量（标签0,1,2,3,4，全流程5个类别）
  dropout_rate: 0.6     # 增加Dropout率以加强正则化

# ==================== 训练配置（RTX 4070深度优化） ====================
training:
  # 基础参数（针对RTX 4070深度优化）
  epochs: 15            # 测试用5个epoch
  batch_size: 128       # 减小batch size以避免内存问题
  learning_rate: 1e-4   # 降低学习率以避免过拟合
  weight_decay: 5e-4    # 增加权重衰减以加强正则化
  
  # 优化器选择
  optimizer: "adamw"    # AdamW优化器
  scheduler: "plateau"  # 基于验证损失的调度器
  
  # 损失函数
  criterion: "cross_entropy"  # 交叉熵损失
  
  # 早停（减少耐心值以更快停止过拟合）
  patience: 10
  
  # 单Fold训练（不使用交叉验证）
  n_folds: 1
  
  # 数据加载（减少内存使用）
  num_workers: 8        # 减少工作进程数避免内存冲突
  pin_memory: false     # 禁用内存固定以减少内存使用
  persistent_workers: false  # 禁用保持工作进程
  prefetch_factor: 2    # 减少预取因子

# ==================== 系统配置（RTX 4070深度优化） ====================
system:
  # 随机种子
  seed: 42
  
  # GPU配置（RTX 4070深度优化）
  gpu:
    memory_fraction: 0.8   # 使用80%的GPU内存，留出更多系统内存
    enable_benchmark: true  # 启用cuDNN benchmark
    enable_flash_attention: false  # 禁用Flash Attention以减少内存使用
    enable_tf32: true      # 启用TF32（提高计算效率）
    enable_amp: true       # 启用自动混合精度
    enable_compile: false  # 禁用torch.compile以减少内存使用

# ==================== 评估配置 ====================
evaluation:
  # 阈值优化
  threshold_optimization:
    enabled: true
    optimization_metric: "f1"  # f1, precision, recall

# ==================== 输出配置 ====================
output:
  # 结果保存路径
  result_dir: "result"
  
  # 日志级别
  logging:
    level: "INFO"

# ==================== 实验配置 ====================
experiment:
  # 实验名称
  name: "VGG16_wav2vec2_layer4_exertion_detection_rtx4070_optimized"
  
  # 实验描述
  description: "基于VGG16和wav2vec2第4层的运动强度检测模型（RTX 4070深度优化，单Fold训练）"
