# 运动强度检测模型训练配置文件（V6版本）
# 使用基于clip的分层分割，完全禁用数据平衡

# ==================== 数据配置 ====================
data:
  # 数据路径
  feature_dir: "data/features"
  label_file: "data/general_information.csv"
  
  # 数据分割（使用基于clip的分层分割确保所有类别都有代表）
  split:
    test_size: 0.1      # 10%作为独立测试集
    val_size: 0.1       # 10%作为验证集
    random_state: 42     # 随机种子
    use_stratified_split: true  # 使用分层分割
  
  # 特征选择
  features:
    use_mfb: true      # 使用MFB特征
    use_wav2vec2: true  # 使用wav2vec2特征
    use_mfcc: true  # 使用MFCC特征
  
  # 数据平衡
  balance_data: false   # 完全禁用数据平衡，保持原始数据分布
  balance_config:
    target_samples_per_class: null  # 不设置目标样本数
    max_oversampling_ratio: 1.0    # 不过采样
  
  # 数据标准化
  normalize_data: true  # 启用数据标准化
  
  # 数据泄露检查
  leakage_check: true   # 启用数据泄露检查
  
  # wav2vec2层选择
  wav2vec2_layers: [4]  # 使用第4层特征
  
  # 特征帧数配置
  target_frames: 300    # 目标帧数（20Hz采样率下的15秒音频）

# ==================== 模型配置 ====================
model:
  # 特征维度配置（根据实际数据调整）
  mfcc_dim: 40          # 实际MFCC维度
  wav2vec2_dim: 768     # wav2vec2特征维度
  num_classes: 5        # 分类数量（标签0,1,2,3,4，全流程5个类别）
  dropout_rate: 0.6     # 增加Dropout率以加强正则化

# ==================== 训练配置（RTX 4070深度优化） ====================
training:
  # 基础参数（针对RTX 4070深度优化）
  epochs: 15            # 训练轮数
  batch_size: 128       # 批大小
  learning_rate: 1e-4   # 学习率
  weight_decay: 5e-4    # 权重衰减
  
  # 优化器选择
  optimizer: "adamw"    # AdamW优化器
  scheduler: "plateau"  # 基于验证损失的调度器
  
  # 损失函数
  criterion: "cross_entropy"  # 交叉熵损失（全类别）
  
  # 早停
  patience: 10
  
  # 单Fold训练（不使用交叉验证）
  n_folds: 1
  
  # 数据加载（减少内存使用）
  num_workers: 8        # 工作进程数
  pin_memory: false     # 禁用内存固定
  persistent_workers: false  # 禁用保持工作进程
  prefetch_factor: 2    # 预取因子

# ==================== 系统配置（RTX 4070深度优化） ====================
system:
  # 随机种子
  seed: 42
  
  # GPU配置（RTX 4070深度优化）
  gpu:
    memory_fraction: 0.8   # 使用80%的GPU内存
    enable_benchmark: true  # 启用cuDNN benchmark
    enable_flash_attention: false  # 禁用Flash Attention
    enable_tf32: true      # 启用TF32
    enable_amp: true       # 启用自动混合精度
    enable_compile: false  # 禁用torch.compile

# ==================== 评估配置 ====================
evaluation:
  # 阈值优化
  threshold_optimization:
    enabled: true
    optimization_metric: "f1"  # f1, precision, recall

# ==================== 输出配置 ====================
output:
  # 结果保存路径
  result_dir: "result"
  
  # 日志级别
  logging:
    level: "INFO"

# ==================== 实验配置 ====================
experiment:
  # 实验名称
  name: "VGG16_wav2vec2_layer4_exertion_detection_v6"
  
  # 实验描述
  description: "基于VGG16和wav2vec2第4层的运动强度检测模型（V6版本：基于clip的分层分割，完全禁用数据平衡）"
